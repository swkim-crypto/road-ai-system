# Render Blueprint — 도로대장 온톨로지 분석 시스템
# 서비스 2개: Fuseki(내부 전용) + Node 앱(공개). 한 레포(모노레포)에서 배포.
# 배포: Render 대시보드 → New → Blueprint → 이 레포 선택.

services:
  # ── ① Fuseki + TDB2 + GeoSPARQL (내부 전용) ────────────────────────
  #   데이터는 이미지에 구워짐(디스크 불필요). 유료=안 잠듦 → 인덱스 1회 빌드 후 유지.
  #   데이터 갱신: 새 loaded.ttl 을 git push → 재배포(이미지 재빌드).
  - type: pserv                      # private service: 외부 비공개, Node 만 내부망 접근 → SPARQL 보호
    name: road-fuseki
    runtime: docker
    plan: starter                    # 유료
    dockerfilePath: ./fuseki/Dockerfile
    dockerContext: ./fuseki

  # ── ② Node 앱 (공개) ──────────────────────────────────────────────
  - type: web
    name: road-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      # ⚠️ Fuseki 가 먼저 배포된 뒤, Render 대시보드의 road-fuseki '내부 주소'를 확인해
      #    아래 값을 맞추세요. (포트는 Fuseki 가 리슨하는 포트. 기본 3030)
      - key: FUSEKI_URL
        value: http://road-fuseki:3030/road/sparql
      - key: KAKAO_JS_KEY            # 대시보드에서 값 입력(시크릿)
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN          # 예: https://road-app.onrender.com
        sync: false
